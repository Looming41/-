<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자 로그인 | 김은정 유학원</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="logo"><span class="dot"></span>김은정 유학원</a>
    <nav class="nav-links" aria-label="주요 메뉴">
      <a href="philosophy.html">우리의 방향성</a>
      <a href="ec.html">EC</a>
      <a href="top10.html">미국 극상위입시<span class="rank">(1-10위)</span></a>
      <a href="top20.html">미국상위입시<span class="rank">(10-20위)</span></a>
      <a href="g1-g8.html">G1-G8 입시프렙</a>
      <a href="news.html">미국입시뉴스</a>
    </nav>
    <div class="header-cta">
      <a href="booking.html" class="btn btn-primary">상담예약</a>
    </div>
  </div>
</header>

<main>
  <section class="page-hero">
    <div class="container">
      <a href="index.html" class="back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
        홈으로
      </a>
      <h1>관리자 로그인</h1>
      <p class="hero-sub">원장 팀 · 입시결과 · EC 성과를 추가/수정하려면 로그인하세요.</p>
    </div>
  </section>

  <section>
    <div class="container">
      <form class="booking-form" id="login-form" novalidate>
        <div class="form-field">
          <label for="email">이메일</label>
          <input type="email" id="email" required autocomplete="username">
        </div>
        <div class="form-field">
          <label for="password">비밀번호</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary form-submit">로그인</button>
        <p class="form-note" id="login-error"></p>
      </form>
    </div>
  </section>
</main>

<footer>
  <div class="container">
    <div class="footer-bottom">© 2026 김은정 유학원. All rights reserved.</div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="supabase-config.js"></script>
<script src="supabase-client.js"></script>
<script>
  document.getElementById("login-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    var errorEl = document.getElementById("login-error");
    errorEl.textContent = "";

    if (!supabaseReady) {
      errorEl.textContent = "Supabase가 아직 연결되지 않았습니다. supabase-config.js를 먼저 설정해주세요.";
      return;
    }

    var email = document.getElementById("email").value.trim();
    var password = document.getElementById("password").value;

    var { error } = await supabaseClient.auth.signInWithPassword({ email: email, password: password });
    if (error) {
      errorEl.textContent = "로그인 실패: " + error.message;
      return;
    }
    window.location.href = "philosophy.html";
  });
</script>

</body>
</html>
